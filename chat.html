  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="chat">
  <a class="skip-link" href="#main">К содержанию</a>
  <div data-slot="header"></div>

  <main id="main">
    <nav class="container" aria-label="Хлебные крошки">
      <ol class="breadcrumbs">
        <li><a href="index.html">Главная</a></li>
        <li><a href="account.html">Личный кабинет</a></li>
        <li aria-current="page">Менеджер</li>
      </ol>
    </nav>

    <section class="page-head container">
      <span class="eyebrow">Личный кабинет</span>
      <h1>Чат с менеджером</h1>
      <p class="lead">Продолжите обсуждение заявки, уточните характеристики и условия доставки.</p>
    </section>

    <section class="section">
      <div class="container-narrow">
        <div class="chat" id="chatBox">
          <div class="chat-head">
            <span class="chat-avatar">МК</span>
            <div>
              <b>Менеджер KRASKU</b>
              <span>на линии · отвечает в течение 15 минут</span>
            </div>
          </div>
          <div class="chat-messages" id="chatMessages" aria-live="polite"></div>
          <div class="chat-form">
            <input id="chatInput" type="text" placeholder="Введите сообщение…" aria-label="Сообщение">
            <button type="button" class="chat-send" id="chatSend" aria-label="Отправить сообщение">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
          </div>
        </div>

        <div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap">
          <button type="button" class="btn btn-outline" data-quick-question="Какие фасовки доступны?">Какие фасовки доступны?</button>
          <button type="button" class="btn btn-outline" data-quick-question="Есть ли скидка на объём?">Есть ли скидка на объём?</button>
          <button type="button" class="btn btn-outline" data-quick-question="Можно ли доставку в мой город?">Можно ли доставку в мой город?</button>
        </div>
      </div>
    </section>
